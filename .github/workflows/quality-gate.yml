name: Quality Gate

# Protects the branches that matter (main, the production Docker branch) on
# every push, gates PRs into them, and also runs on feature branches so
# contributors get the same signal before opening a PR.
on:
  push:
    branches:
      - main
      - infrastructure/production-docker
      - "feature/**"
  pull_request:
    branches:
      - main
      - infrastructure/production-docker

# A new push to the same branch/PR supersedes the previous run instead of
# piling up ephemeral Postgres services.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Schema, migrations, seed idempotency, typecheck, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # GitHub Actions blocks job steps until this healthcheck passes, so
        # migrations can never race an unready database.
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Ephemeral, isolated, CI-only database — created fresh for this job
      # and discarded when it ends. Never a developer or production
      # database. Credentials are dummy values scoped to this container
      # only; they are not secrets and are not related to any real
      # deployment credential.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations (prisma migrate deploy)
        run: npx prisma migrate deploy

      - name: Seed database (run 1)
        run: npm run db:seed

      - name: Record row counts after seed run 1
        run: node scripts/ci/verify-seed.mjs record

      - name: Seed database again (run 2 — idempotency check)
        run: npm run db:seed

      - name: Verify counts stable, no duplicate IDs, relational data correct
        run: node scripts/ci/verify-seed.mjs verify

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  integration-test:
    name: Production Docker image integration test
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image (docker-compose.test.yml)
        run: docker compose -f docker-compose.test.yml build

      - name: Start integration stack
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for application readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/ > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time"
          exit 1

      - name: Seed a test session for authenticated checks
        # A disposable User + Session row, inserted directly in the
        # ephemeral test database via psql inside the postgres container
        # (Postgres publishes no host port, so this cannot be done from the
        # runner). Exploits the app's existing "database" session strategy
        # the same way earlier local verification in this project did -
        # never touches Google OAuth in CI.
        run: |
          docker compose -f docker-compose.test.yml exec -T postgres \
            psql -U citest -d citest -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "User" (id, name, email, role, "createdAt", "updatedAt")
          VALUES ('itest-user', 'Integration Test User', 'itest@example.com', 'USER', now(), now())
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO "Session" (id, "sessionToken", "userId", expires)
          VALUES ('itest-session', 'itest-session-token', 'itest-user', now() + interval '1 day')
          ON CONFLICT (id) DO NOTHING;
          SQL

      - name: Run integration smoke tests
        run: node scripts/ci/integration-test.mjs full

      - name: Restart application container
        run: docker compose -f docker-compose.test.yml restart app

      - name: Wait for application readiness after restart
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/ > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time"
          exit 1

      - name: Run post-restart smoke tests
        run: node scripts/ci/integration-test.mjs recheck

      - name: Restart PostgreSQL and verify recovery
        run: |
          docker compose -f docker-compose.test.yml restart postgres
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.test.yml exec -T postgres pg_isready -U citest -d citest > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done
          node scripts/ci/integration-test.mjs recheck

      - name: Collect container logs on failure
        if: failure()
        run: |
          echo "--- app logs ---"
          docker compose -f docker-compose.test.yml logs app
          echo "--- postgres logs ---"
          docker compose -f docker-compose.test.yml logs postgres

      - name: Tear down integration stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
